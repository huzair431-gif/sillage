services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sillage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-sillage}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sillage}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sillage}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3001}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
    ports:
      - "127.0.0.1:3001:3001"
    command: ["sh", "-c", "npm run db:migrate && node apps/api/dist/main.js"]
volumes:
  postgres_data:
